<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>树上花开 · 上传老照片</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<style>
  body { background: #f4f0e8; color: #27251e; font: 16px/1.6 system-ui, sans-serif; padding: 24px; }
  main { max-width: 34rem; margin: 6vh auto; background: #fff; padding: clamp(20px, 5vw, 42px); border-radius: 16px; }
  label { display: block; font-weight: 600; margin: 18px 0 6px; }
  input { display: block; box-sizing: border-box; max-width: 100%; font: inherit; }
  button { margin-top: 24px; padding: 10px 20px; background: #312a1e; color: #fff; border: 0; border-radius: 7px; font: inherit; cursor: pointer; }
  button:disabled { opacity: .65; }
  #result { overflow-wrap: anywhere; }
  .home { color: #60533d; }
</style>
<main>
  <a class="home" href="./">返回树上花开</a>
  <h1>上传老照片</h1>
  <form id="upload">
    <label for="photo">选择照片</label>
    <input id="photo" type="file" accept="image/jpeg,image/png,image/webp" required aria-describedby="format">
    <p id="format">每次上传一张。支持 JPG、PNG、WebP，文件不超过 20 MB。</p>
    <button type="submit">上传照片</button>
  </form>
  <p id="result" role="status"></p>
</main>
<script>
  const form = document.getElementById("upload");
  const photoInput = document.getElementById("photo");
  const result = document.getElementById("result");
  const submit = form.querySelector("button");
  const endpoint = "https://sshk-photo-intake.yuanyeichen.workers.dev/upload";

  photoInput.addEventListener("change", () => { result.textContent = ""; });

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    if (submit.disabled) return;
    if (photoInput.files.length !== 1) {
      result.textContent = "请选择一张照片。";
      return;
    }

    const file = photoInput.files[0];
    if (file.size > 20 * 1024 * 1024) {
      result.textContent = "照片超过 20 MB，请重新选择。";
      return;
    }

    submit.disabled = true;
    photoInput.disabled = true;
    result.textContent = "正在上传 " + file.name;
    try {
      const response = await fetch(endpoint, {
        method: "POST",
        headers: {"Content-Type": "application/octet-stream"},
        body: file,
      });
      const data = await response.json();
      if (!response.ok) {
        result.textContent = data.error;
        return;
      }
      result.textContent = file.name + " · 已接收，编号 " + data.receipt.slice(0, 8);
      form.reset();
    } catch {
      result.textContent = "上传未获确认，请稍后重试。";
    } finally {
      submit.disabled = false;
      photoInput.disabled = false;
    }
  });
</script>
</html>
